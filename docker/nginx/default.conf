server {
    listen 80;
    listen [::]:80;
    server_name batchnav-api *.batchnav-api;

    root /var/www/nginx/batch-nav/sync-bk/public;

    index index.php index.html index.htm;

    # Labor Tracker is served by the new backend while the browser keeps using
    # the same host and path as the legacy sync-bk API.
    # location ~ ^/api/labor-trackers?(?:/|$) {
    #     include fastcgi_params;
    #     fastcgi_pass php-nginx:9000;
    #     fastcgi_index index.php;

    #     # Use the new backend public directory as the document root for this route.
    #     fastcgi_param DOCUMENT_ROOT /var/www/nginx/BatchNav__Back__v2-NoExcuses/public;
    #     # Execute the new backend index.php instead of the legacy sync-bk index.php.
    #     fastcgi_param SCRIPT_FILENAME /var/www/nginx/BatchNav__Back__v2-NoExcuses/public/index.php;
    #     # Tell the PHP app that the executed script is the front controller.
    #     fastcgi_param SCRIPT_NAME /index.php;
    #     # Clear PATH_INFO so the request is handled by Laravel routing.
    #     fastcgi_param PATH_INFO "";

    #     # Forward the Authorization header so bearer tokens can be validated.
    #     fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    #     # Forward cookies so session-based authentication can be read.
    #     fastcgi_param HTTP_COOKIE $http_cookie;
    #     # Keep the original host visible to the new backend.
    #     fastcgi_param HTTP_HOST $host;
    #     # Preserve the original client/proxy chain for request context and logs.
    #     fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    #     # Preserve the externally requested host for framework URL/cookie logic.
    #     fastcgi_param HTTP_X_FORWARDED_HOST $host;
    #     # Preserve whether the original request used http or https.
    #     fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-nginx:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ── Frontend — batchnav-app (Vite + Vue SPA) ──────────────────────────────────
# Serves the production build generated by `vite build`.
# Cache strategy:
#   • index.html          → never cache (references hashed chunk names)
#   • assets/*.js, *.css  → cache forever  (content hash in filename)
#   • images, fonts, etc. → cache 1 week   (no hash, rarely changes)
#   • all other paths     → SPA fallback to index.html (Vue Router)
server {
    listen 80;
    listen [::]:80;
    server_name batchnav-app *.batchnav-app;

    root /var/www/nginx/batch-nav/dist;
    index index.html;

    # ── 1. index.html: never cache ────────────────────────────────────────────
    # This file references the current build's hashed assets.
    # Caching it means users load old chunks that no longer exist on the server.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── 2. Hashed assets (JS, CSS): cache forever ─────────────────────────────
    # Vite embeds a content hash in the filename. If the code changes, the
    # filename changes too — so it is always safe to cache these for 1 year.
    # `immutable` tells the browser to skip revalidation requests entirely.
    location ~* /assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 3. Static assets without hash (images, fonts, icons) ─────────────────
    # These rarely change, but have no hash in the name — 1 week is safe.
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── 4. SPA fallback ────────────────────────────────────────────────────────
    # All unmatched paths fall back to index.html so Vue Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name batchnav-api *.batchnav-api;

    location / {
        proxy_pass http://php-nginx:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
