services:
  php:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    build:
      context: .
      dockerfile: docker/php/${PHP_VERSION:-8.4}/Dockerfile
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-true}
        INSTALL_BROWSER_TOOLS: ${INSTALL_BROWSER_TOOLS:-false}
        INSTALL_PUPPETEER: ${INSTALL_PUPPETEER:-false}
    container_name: php
    environment:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
      BROWSERSHOT_CHROME_PATH: "/usr/bin/chromium"
      NODE_BINARY: "/usr/bin/node"
      NPM_BINARY: "/usr/bin/npm"
    volumes:
      - ./volumes-projects/nginx:/var/www/nginx
      - ./volumes-projects/apache:/var/www/apache
      - ./volumes-projects/${WEB_SERVER:-nginx}:/var/www/workspace
    ports:
      - "${XDEBUG_PORT:-9003}:9003"
      - "4173:4173"
      - "4000:4000"
      - "5175:5175"
    depends_on:
      - mysql
      - postgresql
      - redis
    networks:
      - app-network

  nginx:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: nginx:1.27-bookworm
    restart: unless-stopped
    container_name: nginx
    volumes:
      - ./volumes-projects/nginx:/var/www/nginx
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - php
    networks:
      - app-network

  apache:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    restart: unless-stopped
    container_name: apache
    volumes:
      - ./volumes-projects/apache:/var/www/apache
    ports:
      - "${APACHE_PORT:-8080}:80"
    depends_on:
      - php
    networks:
      - app-network

  mysql:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: mysql:8.4
    restart: unless-stopped
    container_name: mysql
    command: ["--datadir=/var/lib/mysql/data"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./volumes-data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-true}
    networks:
      - app-network

  postgresql:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: postgres:17-bookworm
    restart: unless-stopped
    container_name: postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes-data/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - app-network

  redis:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: redis:7-bookworm
    restart: unless-stopped
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes-data/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
