name: php-projects-app

x-php-build-args: &php-build-args
  INSTALL_XDEBUG: ${INSTALL_XDEBUG:-true}
  INSTALL_BROWSER_TOOLS: ${INSTALL_BROWSER_TOOLS:-false}
  INSTALL_PUPPETEER: ${INSTALL_PUPPETEER:-false}

x-php-common: &php-common
  platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
  environment:
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    BROWSERSHOT_CHROME_PATH: "/usr/bin/chromium"
    NODE_BINARY: "/usr/bin/node"
    NPM_BINARY: "/usr/bin/npm"
  networks:
    - shared-services

services:
  php-nginx:
    container_name: php-projects-php-nginx
    hostname: php-nginx
    <<: *php-common
    build:
      context: .
      dockerfile: docker/php/${NGINX_PHP_VERSION:-8.4}/Dockerfile
      args: *php-build-args
    volumes:
      - ./volumes-projects/nginx:/var/www/nginx
      - ./volumes-projects/apache:/var/www/apache
      - ./volumes-projects/nginx/${WEB_PROJECT_DIR_NGINX:-.}:/var/www/workspace
    ports:
      - "${XDEBUG_NGINX_PORT:-9003}:9003"
      - "${PHP_NGINX_PORT_4173:-4173}:4173"
      - "${PHP_NGINX_PORT_4000:-4000}:4000"
      - "${PHP_NGINX_PORT_5175:-5175}:5175"
      - "${LARAVEL_REVERB_NGINX_PORT:-8081}:8081"
      - "${NEST_JS_NGINX_PORT:-9005}:3000"

  php-apache:
    container_name: php-projects-php-apache
    hostname: php-apache
    <<: *php-common
    build:
      context: .
      dockerfile: docker/php/${APACHE_PHP_VERSION:-7.4}/Dockerfile
      args: *php-build-args
    volumes:
      - ./volumes-projects/nginx:/var/www/nginx
      - ./volumes-projects/apache:/var/www/apache
      - ./volumes-projects/apache/${WEB_PROJECT_DIR_APACHE:-.}:/var/www/workspace
    ports:
      - "${XDEBUG_APACHE_PORT:-9004}:9003"
      - "${PHP_APACHE_PORT_4173:-4273}:4173"
      - "${PHP_APACHE_PORT_4000:-4100}:4000"
      - "${PHP_APACHE_PORT_5175:-5275}:5175"
      - "${LARAVEL_REVERB_APACHE_PORT:-8181}:8081"
      - "${NEST_JS_APACHE_PORT:-9006}:3000"

  nginx:
    container_name: php-projects-nginx
    hostname: nginx
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: nginx:1.27-bookworm
    restart: unless-stopped
    volumes:
      - ./volumes-projects/nginx:/var/www/nginx
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - php-nginx
    networks:
      - shared-services

  apache:
    container_name: php-projects-apache
    hostname: apache
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    restart: unless-stopped
    volumes:
      - ./volumes-projects/apache:/var/www/apache
    ports:
      - "${APACHE_PORT:-8080}:80"
    depends_on:
      - php-apache
    networks:
      - shared-services

networks:
  shared-services:
    external: true
    name: php-projects-shared-services
